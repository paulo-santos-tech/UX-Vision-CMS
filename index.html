<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UX Vision | Admin CMS</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
            },
            colors: {
              neon: {
                purple: '#b200ff',
                cyan: '#00e2ff',
              },
              base: 'rgb(var(--bg-base) / <alpha-value>)',
              surface: 'rgb(var(--surface) / <alpha-value>)',
              'surface-elevated': 'rgb(var(--surface-elevated) / <alpha-value>)',
              divider: 'rgb(var(--border) / <alpha-value>)',
              'text-primary': 'rgb(var(--text-primary) / <alpha-value>)',
              'text-muted': 'rgb(var(--text-muted) / <alpha-value>)',
            },
            backgroundImage: {
              'main-gradient': "radial-gradient(circle at 15% 50%, rgba(178, 0, 255, 0.08), transparent 25%), radial-gradient(circle at 85% 30%, rgba(0, 226, 255, 0.08), transparent 25%)"
            }
          }
        }
      }
    </script>
    <style>
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }
    </style>
</head>
  <body class="bg-base text-text-primary bg-main-gradient bg-fixed min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
